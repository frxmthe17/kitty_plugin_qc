[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qc"
version = "0.1.0"
description = "SSH-подключения, туннели-демон, быстрые команды и пароли — не выходя из терминала"
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.scripts]
qc = "qc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
