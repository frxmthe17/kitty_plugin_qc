[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qc"
version = "0.1.0"
description = "SSH connections, a tunnels daemon, quick commands and passwords — without leaving the terminal"
requires-python = ">=3.11"
dependencies = ["textual>=1.0", "pyrage>=1.2"]

[project.scripts]
qc = "qc.cli:main"
qc-askpass = "qc.askpass:main"

[tool.setuptools.packages.find]
where = ["src"]
